# Cloudflare Workers 部署設定
#
# 免費方案：每天 10 萬次請求，且不會像 Render 免費版那樣閒置休眠。
#
# 部署前要設定的機密（不要寫在這個檔案裡，它會進版控）：
#   npx wrangler secret put NVIDIA_API_KEY
#
# 或直接在 Cloudflare 主控台的 Settings → Variables and Secrets 設定。

name = "yoxi-api"
main = "src/worker.ts"
# 注意：Cloudflare 用 UTC 判斷，不能填未來日期。
# 台灣是 UTC+8，本機日期常比 UTC 早一天，所以刻意往前抓。
compatibility_date = "2026-09-01"

# 讓 Workers 支援 process.env 與部分 Node API，程式碼才能與本機版一致
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
LLM_PROVIDER = "nvidia"
NVIDIA_MODEL = "nvidia/nemotron-3-super-120b-a12b"
LLM_FALLBACK_MODEL = "nvidia/nemotron-3.5-lightning-30b-a3b"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
LLM_MAX_RETRIES = "2"
LLM_MAX_OUTPUT_TOKENS = "8000"

# 只允許自己的前端呼叫。留空的話任何網站都能用這個後端、消耗 API 額度。
# 注意這擋的是「其他網站」，不是「其他人」—— 使用者照常從下面這個網址使用。
ALLOWED_ORIGINS = "https://yoxiargame.pages.dev"
