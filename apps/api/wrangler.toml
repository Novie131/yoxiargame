# Cloudflare Workers 部署設定
#
# 免費方案：每天 10 萬次請求，且不會像 Render 免費版那樣閒置休眠。
#
# 部署前要設定的機密（不要寫在這個檔案裡，它會進版控）：
#   npx wrangler secret put NVIDIA_API_KEY
#
# 或直接在 Cloudflare 主控台的 Settings → Variables and Secrets 設定。

name = "yoxi-api"
main = "src/worker.ts"
# 注意：Cloudflare 用 UTC 判斷，不能填未來日期。
# 台灣是 UTC+8，本機日期常比 UTC 早一天，所以刻意往前抓。
compatibility_date = "2026-09-01"

# 讓 Workers 支援 process.env 與部分 Node API，程式碼才能與本機版一致
compatibility_flags = ["nodejs_compat"]

# 交通監看的排程。每 2 分鐘一輪，對應 src/worker.ts 的 scheduled()。
#
# 間隔刻意不小於 services/tdx.ts 的事件快取 TTL（60 秒）—— 那樣輪詢會命中
# 使用者請求也在用的快取，不會額外吃掉 TDX 每分鐘 5 次的額度。
#
# 要有下面的 Hyperdrive 綁定，這一輪才會真的產生通知；沒有的話會安靜略過。
[triggers]
crons = ["*/2 * * * *"]

# ── 資料庫（Hyperdrive）──
#
# Workers 不能開任意 TCP 連線，pg 因此在上面是死的。Hyperdrive 在 Cloudflare
# 邊緣代理這條連線並自己維護連線池，Worker 端照舊用 pg —— 程式碼與 Node 部署共用。
# 接線在 src/worker.ts 的 applyEnv()，不需要再改任何程式碼。
#
# 綁定沒設定時，hasDatabase() 是 false，資料庫相關功能會停用而不是壞掉。
# 也就是說下面這幾行在打開之前，線上的任務標記、通勤路線、通知都會是空的。
#
# 設定步驟：
#
# 1. 先有一台「公開連得到」的 Postgres。目前 infra/compose 那台跑在本機 Colima 裡，
#    Hyperdrive 連不到，所以要另外開一台雲端的（Neon / Supabase / RDS 都可以），
#    **並且要能裝 PostGIS** —— missions 的地理查詢靠它。
#
# 2. 把 7 支 migration 套到那台上。migrate.ts 讀檔案系統，不能在 Workers 上跑，
#    所以是從本機指著雲端資料庫跑：
#      DATABASE_URL='postgres://...雲端那台...' npm run db:migrate
#
# 3. 建立 Hyperdrive 設定，把它回傳的 id 填到下面：
#      npx wrangler hyperdrive create yoxi-db --connection-string='postgres://...'
#
# 4. 取消下面三行的註解、填入 id，然後 npm --prefix apps/api run cf:deploy
#
# id 不是機密（真正的帳密存在 Cloudflare 那邊的 Hyperdrive 設定裡），可以進版控。
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<步驟 3 產生的 id>"
# 本機 wrangler dev 時改連 compose 那台，不經過 Hyperdrive
# localConnectionString = "postgres://movequest:movequest@localhost:5432/movequest"

[observability]
enabled = true

[vars]
LLM_PROVIDER = "nvidia"
NVIDIA_MODEL = "nvidia/nemotron-3-super-120b-a12b"
LLM_FALLBACK_MODEL = "nvidia/nemotron-3.5-lightning-30b-a3b"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
LLM_MAX_RETRIES = "2"
LLM_MAX_OUTPUT_TOKENS = "8000"

# 只允許自己的前端呼叫。留空的話任何網站都能用這個後端、消耗 API 額度。
# 注意這擋的是「其他網站」，不是「其他人」—— 使用者照常從下面這個網址使用。
ALLOWED_ORIGINS = "https://yoxiargame.pages.dev"
